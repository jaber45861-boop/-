# Grimoire v3 — Planner (L2) module manifest
# Schema: docs/v3/03-extension-contract.md §2 (field set is normative; no fields beyond it).
id: "planner"
version: "1.0.0"
core: ">=3.0 <4.0"
name: "Planner"
purpose: "Produce the ordered change plan for a task — the four questions of 01 §5.1 (what files change and why, in what order, how it will be verified, what can go wrong) at exactly the depth the effort tier demands (01 §3.1/§3.2, 04 §2 G5) — as a deterministic, fail-closed plan document with a Report Bus completion report for every terminal attempt; planning never substitutes for building (01 §5.6) and the planner executes nothing."
phases:
  - PLAN
requires:
  tools: []
provides:
  - "planner:plan"
consumes:
  - "report-bus:build"
conflicts: []
outputs:
  - "planner-plan-report"
errors:
  - E-INPUT
  - E-ENV
  - E-CONFLICT
  - E-VALID
entry: "modules/planner/index.mjs"
